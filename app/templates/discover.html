{% extends "base.html" %}
{% block title %}Discover Leads{% endblock %}

{% block content %}
<div x-data="discoverApp()">
  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-2xl font-bold" style="color: var(--text)">Discover Leads</h1>
      <p class="mt-1 text-sm" style="color: var(--text-muted)">Search multiple sources for businesses that need a website</p>
    </div>
  </div>

  <!-- Search form -->
  <div class="card mb-6">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
      <div>
        <label class="block text-xs font-medium mb-1.5 uppercase tracking-wide" style="color: var(--text-muted)">Industry</label>
        <select x-model="industry" class="input-field">
          <option value="">Select industry...</option>
          {% for ind in industries %}
          <option value="{{ ind }}">{{ ind }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5 uppercase tracking-wide" style="color: var(--text-muted)">Country</label>
        <select x-model="country" @change="onCountryChange()" class="input-field">
          <option value="">Select country...</option>
          {% for c in countries %}
          <option value="{{ c }}">{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5 uppercase tracking-wide" style="color: var(--text-muted)">City</label>
        <div class="relative">
          <input type="text" x-model="city" @focus="showCities = true" @click.away="showCities = false"
                 @input="filterCities()" placeholder="Type or select city..." class="input-field">
          <!-- City suggestions dropdown -->
          <div x-show="showCities && filteredCities.length > 0" x-transition
               class="absolute z-30 w-full mt-1 rounded-lg overflow-hidden max-h-52 overflow-y-auto"
               style="background: var(--bg-surface); border: 1px solid var(--border); box-shadow: var(--shadow-lg)">
            <template x-for="c in filteredCities" :key="c">
              <button @mousedown.prevent="city = c; showCities = false"
                      class="w-full text-left px-3 py-2 text-sm transition"
                      style="color: var(--text)"
                      :style="city === c ? 'background: var(--accent-soft); color: var(--accent-text)' : ''"
                      @mouseenter="$el.style.background='var(--bg-surface-hover)'"
                      @mouseleave="$el.style.background= city === c ? 'var(--accent-soft)' : ''"
                      x-text="c">
              </button>
            </template>
          </div>
        </div>
      </div>
      <div class="flex items-end">
        <button @click="startScrape()" :disabled="scraping || !industry || !city || !country" class="btn-primary w-full justify-center h-[38px]">
          <template x-if="!scraping">
            <span class="flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
              Find Businesses
            </span>
          </template>
          <template x-if="scraping">
            <span class="flex items-center gap-2">
              <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
              Scraping...
            </span>
          </template>
        </button>
      </div>
    </div>

    <!-- Source toggles -->
    <div>
      <label class="block text-xs font-medium mb-2 uppercase tracking-wide" style="color: var(--text-muted)">Data Sources</label>
      <div class="flex flex-wrap gap-2">
        <label class="pill cursor-pointer flex items-center gap-2" :class="sources.includes('openstreetmap') ? 'active' : ''">
          <input type="checkbox" value="openstreetmap" x-model="sources" class="hidden">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.94-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          OpenStreetMap
        </label>
        <label class="pill cursor-pointer flex items-center gap-2" :class="sources.includes('google_maps') ? 'active' : ''">
          <input type="checkbox" value="google_maps" x-model="sources" class="hidden">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          Google Maps
        </label>
        <label class="pill cursor-pointer flex items-center gap-2" :class="sources.includes('yelp') ? 'active' : ''">
          <input type="checkbox" value="yelp" x-model="sources" class="hidden">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          Bing Local
        </label>
      </div>
    </div>
  </div>

  <!-- Scraping progress -->
  <template x-if="scraping">
    <div class="card mb-6" style="border-color: var(--accent-border)">
      <div class="flex items-center gap-3">
        <div class="w-2.5 h-2.5 rounded-full animate-pulse-dot" style="background: var(--accent)"></div>
        <span class="text-sm" style="color: var(--text-secondary)">
          Searching
          <template x-for="(s, i) in sources" :key="s">
            <span>
              <strong style="color: var(--text)" x-text="s === 'google_maps' ? 'Google Maps' : s === 'yelp' ? 'Bing Local' : s === 'openstreetmap' ? 'OpenStreetMap' : 'Google Search'"></strong><span x-show="i < sources.length - 1">, </span>
            </span>
          </template>
          for <strong style="color: var(--text)" x-text="industry"></strong> in <strong style="color: var(--text)" x-text="city"></strong>... This may take 1-3 minutes.
        </span>
      </div>
      <div class="progress-bar mt-3">
        <div class="progress-fill" style="background: var(--accent)" :style="`width: ${progress}%`"></div>
      </div>
    </div>
  </template>

  <!-- Results -->
  <template x-if="results.length > 0">
    <div class="card">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-semibold" style="color: var(--text)">
          Found <span x-text="results.length" class="text-accent"></span> Businesses
        </h2>
        <div class="flex gap-1.5">
          <button @click="filterWebsite = 'none'" class="pill" :class="filterWebsite === 'none' ? 'active' : ''">No Website</button>
          <button @click="filterWebsite = 'has'" class="pill" :class="filterWebsite === 'has' ? 'active' : ''">Has Website</button>
          <button @click="filterWebsite = 'all'" class="pill" :class="filterWebsite === 'all' ? 'active' : ''">All</button>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left" style="color: var(--text-muted); border-bottom: 1px solid var(--border)">
              <th class="pb-3 pr-4 font-medium text-xs uppercase tracking-wide">Business</th>
              <th class="pb-3 pr-4 font-medium text-xs uppercase tracking-wide">Phone</th>
              <th class="pb-3 pr-4 font-medium text-xs uppercase tracking-wide">Website</th>
              <th class="pb-3 pr-4 font-medium text-xs uppercase tracking-wide">Rating</th>
              <th class="pb-3 pr-4 font-medium text-xs uppercase tracking-wide">Source</th>
              <th class="pb-3 font-medium text-xs uppercase tracking-wide">Actions</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="biz in filteredResults" :key="biz.id">
              <tr class="table-row">
                <td class="py-3 pr-4">
                  <div class="font-medium" style="color: var(--text)" x-text="biz.business_name"></div>
                  <div class="text-xs mt-0.5" style="color: var(--text-muted)" x-text="biz.category || biz.address"></div>
                </td>
                <td class="py-3 pr-4">
                  <span x-show="biz.phone" style="color: var(--text-secondary)" x-text="biz.phone"></span>
                  <span x-show="!biz.phone" style="color: var(--text-muted)">&mdash;</span>
                </td>
                <td class="py-3 pr-4">
                  <template x-if="biz.has_website">
                    <a :href="biz.website_url" target="_blank" class="text-accent hover:underline text-xs truncate block max-w-[180px]" x-text="biz.website_url"></a>
                  </template>
                  <template x-if="!biz.has_website">
                    <span class="badge" style="background: var(--danger-soft); color: var(--danger)">No Website</span>
                  </template>
                </td>
                <td class="py-3 pr-4">
                  <template x-if="biz.google_rating">
                    <span style="color: var(--warning)">
                      <span x-text="biz.google_rating"></span>
                      <span class="text-xs" style="color: var(--text-muted)">(<span x-text="biz.google_reviews || 0"></span>)</span>
                    </span>
                  </template>
                  <template x-if="!biz.google_rating">
                    <span style="color: var(--text-muted)">&mdash;</span>
                  </template>
                </td>
                <td class="py-3 pr-4">
                  <span class="text-xs" style="color: var(--text-muted)" x-text="(biz.source || '').split(':')[0]"></span>
                </td>
                <td class="py-3">
                  <a :href="'/leads/' + biz.id" class="btn-secondary !px-2.5 !py-1 text-xs">View</a>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </template>

  <!-- Recent scrape jobs -->
  <div class="mt-8" x-show="recentJobs.length > 0">
    <h3 class="text-xs font-medium uppercase tracking-wide mb-3" style="color: var(--text-muted)">Recent Searches</h3>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <template x-for="job in recentJobs" :key="job.id">
        <div class="card card-interactive !p-3" @click="loadJobResults(job.id)">
          <div class="text-sm font-medium" style="color: var(--text)" x-text="job.query"></div>
          <div class="flex items-center gap-2 mt-1.5">
            <span class="text-xs font-medium" :style="job.status === 'COMPLETED' ? 'color: var(--success)' : job.status === 'RUNNING' ? 'color: var(--warning)' : 'color: var(--danger)'" x-text="job.status"></span>
            <span class="text-xs" style="color: var(--text-muted)" x-text="job.results_count + ' leads'"></span>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const CITIES_BY_COUNTRY = {{ cities_by_country | tojson }};

function discoverApp() {
  return {
    industry: '', city: '', country: '',
    sources: ['openstreetmap', 'google_maps', 'yelp'],
    scraping: false, progress: 0, jobId: null,
    results: [], recentJobs: [], filterWebsite: 'all',
    allCities: [], filteredCities: [], showCities: false,

    get filteredResults() {
      if (this.filterWebsite === 'none') return this.results.filter(b => !b.has_website);
      if (this.filterWebsite === 'has') return this.results.filter(b => b.has_website);
      return this.results;
    },

    async init() {
      try { this.recentJobs = await api('/discover/recent-jobs'); } catch(e) {}
    },

    onCountryChange() {
      this.allCities = CITIES_BY_COUNTRY[this.country] || [];
      this.filteredCities = [...this.allCities];
      this.city = '';
    },

    filterCities() {
      const q = this.city.toLowerCase();
      this.filteredCities = q
        ? this.allCities.filter(c => c.toLowerCase().includes(q))
        : [...this.allCities];
      this.showCities = true;
    },

    async startScrape() {
      if (this.sources.length === 0) {
        toast('Select at least one data source', 'error');
        return;
      }
      this.scraping = true; this.progress = 5; this.results = [];
      try {
        const data = await api('/discover/start', {
          method: 'POST',
          body: JSON.stringify({
            industry: this.industry, city: this.city, country: this.country,
            sources: this.sources,
          }),
        });
        this.jobId = data.job_id;
        this.pollJob();
      } catch(e) { this.scraping = false; }
    },

    async pollJob() {
      if (!this.jobId) return;
      const poll = async () => {
        try {
          const data = await api(`/discover/job/${this.jobId}`);
          if (data.status === 'COMPLETED') {
            this.results = data.leads; this.scraping = false; this.progress = 100;
            toast(`Found ${data.leads.length} businesses!`, 'success');
            this.recentJobs = await api('/discover/recent-jobs');
            return;
          }
          if (data.status === 'FAILED') {
            this.scraping = false;
            toast('Scrape failed: ' + (data.error_message || 'Unknown error'), 'error');
            return;
          }
          this.progress = Math.min(90, this.progress + 3);
          setTimeout(poll, 4000);
        } catch(e) { this.scraping = false; }
      };
      setTimeout(poll, 4000);
    },

    async loadJobResults(jobId) {
      try { const data = await api(`/discover/job/${jobId}`); this.results = data.leads || []; } catch(e) {}
    }
  };
}
</script>
{% endblock %}
